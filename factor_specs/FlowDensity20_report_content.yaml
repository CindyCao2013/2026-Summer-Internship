card_fields:
  hypothesis: |
    Net active flow / mktcap (20d) predicts returns as a Flow × Liquidity interaction,
    not as pure directional smart money.
  mechanism:
    - microstructure
    - liquidity
  formula: "MA20(net_active_flow / mktcap); diagnostics include Flow⊥Amount"
  data_requirement:
    - active buy/sell flow
    - mktcap
    - amount
  known_failure_modes:
    - misclassified_as_pure_flow
    - amount_channel_entanglement
    - naive_blend_with_TGD
  do_not:
    - freeze as pure flow without amount-orth evidence
    - equal-weight with TGD by default
