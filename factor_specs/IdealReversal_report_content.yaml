card_fields:
  hypothesis: |
    Cutting 20d returns by ATS isolates high-trade-size reversal information (M_high − M_low).
  mechanism:
    - microstructure
  formula: "M = sum(r|high ATS) - sum(r|low ATS); knife=ATS"
  data_requirement:
    - close/return
    - amount
    - trade_count
  known_failure_modes:
    - weak_monotonicity
    - sharpe_below_soft_bar
    - missing_execution
  do_not:
    - promote to validated without Production Track + mono fix
    - confuse with raw Ret20
