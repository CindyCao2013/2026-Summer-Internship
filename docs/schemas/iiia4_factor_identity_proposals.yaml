# Proposed factor identities — III-A4 (NOT in Registry)

These YAML blocks are **design locks only**.  
Do not copy into `research/registry/` until implementation + pack exist.

---

## SmartMoney10d (preferred first)

```yaml
factor_id: SmartMoney10d
display_name: Smart Money 10d
paper: 聪明钱因子模型
identity_class: true_replication_candidate
status_when_admitted: testing
data_level: minute
source: paper

construction:
  object: minute_vwap
  knife: "S_t = abs(ret_1m) / volume_1m ** 0.25"
  lookback_days: 10
  top_cumvol_pct: 0.20
  output: "VWAP_smart / VWAP_all"
  direction_paper: negative_ic

required_fields:
  - Close
  - Volume
  - Amount   # preferred for VWAP; Close*Volume fallback must be documented if used

forbidden:
  - redefine knife with Active_buy_* under this factor_id
  - daily OHLCV approximation
  - alias ActiveTradeProxy

provenance_note: |
  Matches research/factor_cutting Stage-0 Smart Money definition.
  Active buy/sell columns exist but are out of scope for this identity.
```

