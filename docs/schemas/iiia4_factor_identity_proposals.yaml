## APM_SessionResidual (second; adapted)

```yaml
factor_id: APM_SessionResidual
display_name: APM Session Residual
paper: APM因子模型 / 主动买卖
identity_class: adapted_replication
status_when_admitted: testing
data_level: minute_plus_eod_index
source: paper_adapted

construction:
  overnight: "Open / prev_Close - 1"
  afternoon_pm: "session return from minute Close 13:01–15:00"
  residual: "stock_session - index_session (EOD index open/close proxy unless index minute found)"
  output: "APM_stat then CS residual vs Ret20"
  direction_paper: positive_ic

required_fields:
  - stock minute Close (PM window)
  - stock EOD Open/Close
  - index EOD Open/Close (or Ret)

distinct_from:
  ActiveTradeProxy: |
    Proxy = rolling t-stat of (overnight - daytime) without index residual,
    without PM minute session, without Ret20 residual.

upgrade_to_true_when: |
  Original PDF confirms session boundaries + index residual method,
  and/or index minute bars become available.

forbidden:
  - rename ActiveTradeProxy to APM_SessionResidual
  - claim true replication while index residual is EOD-only without PDF sign-off
```

