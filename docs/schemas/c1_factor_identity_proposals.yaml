## Rejected / deferred names

```yaml
rejected:
  ActiveTrade:
    reason: bare name invites proxy confusion; reserved until true/adapted pack exists
  ActiveTrade_Paper:
    reason: still collides linguistically with ActiveTradeProxy
  promote_ActiveTradeProxy:
    reason: provenance break

acceptable_synonym_not_preferred:
  ActiveTradeSessionResidual:
    note: OK if naming must say ActiveTrade; prefer APM_SessionResidual for continuity with III-A4

deferred_separate_research:
  ActiveBuyImbalance20:
    case: A  # (ActiveBuy - ActiveSell) / (ActiveBuy + ActiveSell)
    note: |
      Minute Active_* fields support this, but it is NOT paper APM.
      If pursued later, new factor_id only — never under APM_* / ActiveTrade*.
```

