## Proposed — APM_SessionResidual (C1 paper track)

```yaml
factor_id: APM_SessionResidual
display_name: APM Session Residual
paper: APM因子模型 / 主动买卖
alias_in_cutting_dsl: [apm, active_trade]
identity_class: adapted_replication
status: testing_candidate
registry: false
data_level: minute_plus_eod_index
source: paper_adapted
direction_paper: positive_ic
pack_v1: research/reports/factors/APM_SessionResidual
execution_recipe_frozen: "highAPM|daily|buffer_10_30"

construction:
  object: overnight_residual_vs_afternoon_residual
  knife: time_of_day_buckets   # overnight_am vs afternoon_pm
  overnight: "Open / prev_Close - 1"
  afternoon_pm: "session return from minute Close 13:01–15:00"
  residual: "stock_session - index_session (EOD index open/close proxy unless index minute found)"
  output: "APM_stat then CS residual vs Ret20"

required_fields:
  - stock minute Close (PM window)
  - stock EOD Open / Close
  - index EOD Open / Close (or Ret)
  - Ret20 panel for CS residual

not_required_for_paper:
  - Active_buy_volume
  - Active_sell_volume
  - Active_buy_amount
  - Active_sell_amount
  - Active_buy_count
  - Active_sell_count

distinct_from:
  ActiveTradeProxy: |
    Proxy = rolling t-stat of (overnight - daytime) without index residual,
    without PM minute session, without Ret20 residual.
  SmartMoney10d: |
    Different paper. Knife is |R|/V^0.25 VWAP ratio, not session residual.
  FlowDensity20: |
    Active amount / mktcap flow timing — different object.

upgrade_to_true_when: |
  Original PDF confirms session boundaries + index residual method,
  and/or index minute bars become available.
  # Does NOT block adapted Phase1 implementation.
  # Phase1 = adapted_replication; Phase2+ may upgrade identity_class to true.

implementation_policy:
  phase1: adapted_implementation   # EOD index session proxy OK
  phase1_blocks_on_pdf: false
  phase2_identity_upgrade: when_pdf_or_index_minute

forbidden:
  - use bare factor_id ActiveTrade before pack exists
  - rename ActiveTradeProxy to this id
  - put Active_buy_* knife under this factor_id
  - Registry / Composite / Portfolio before Pack v1 gate
  - claim true_replication while index residual is EOD daytime proxy
```

