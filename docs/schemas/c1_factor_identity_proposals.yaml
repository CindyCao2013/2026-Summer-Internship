## Existing — ActiveTradeProxy (unchanged)

```yaml
factor_id: ActiveTradeProxy
display_name: Active Trade Proxy (APM overnight−day)
identity_class: research_proxy
status: testing
data_level: EOD
registry: false   # pack exists; not paper replication
source:
  type: paper_proxy
  paper_id: kysec_apm_active_trade

construction:
  formula: "t = mean(r_ON - r_DAY) / (std / sqrt(n)); window=20"
  r_ON: "Open / prev_Close - 1"
  r_DAY: "Close / Open - 1"
  residualization: none
  ret20_cs_residual: false
  pm_minute_session: false

answers: "when does return accrue (overnight vs day)?"
not_answers: "paper session residual alpha vs index + Ret20"

forbidden:
  - rename to ActiveTrade
  - rename to APM
  - rename to APM_SessionResidual
  - promote to candidate as if paper-replicated
  - claim true ActiveTrade / APM replication
```

