# schema: factor_pack_summary_v1
factor_id: IdealAmplitude
display_name: Ideal Amplitude
short_name: IdealAmplitude
family: microstructure
source:
  type: paper
  paper_title: 振幅因子的隐藏结构
  paper_id: kysec_amplitude_hidden_structure
  colloquial: 理想振幅因子（W-cut by close state）

status: testing
formula_frozen: false
pack_version: v1
pack_finalized: "2026-07-21"

economic_intuition: |
  Daily amplitude split by close-price state within a 20-day window.
  High close-state amplitude embeds stronger negative alpha;
  spread V = V_high − V_low purifies vs uncut Amp20.

formula:
  object: "Amp = high/low − 1"
  knife: "close price state; quantile_split λ=0.25 in 20d window"
  frozen: "V = mean(amp | high-close) − mean(amp | low-close)"
  signal_shift: 1
  window: 20
  lambda_frac: 0.25
  direction: negative RankIC (short high V)

data:
  level: EOD
  universe_research: ALL
  period_requested: "2018-01-01_2025-12-31"
  period_actual: "cutting_v1_harvest_3885d + exec_last_252d"
  n_days: 3885
  coverage_exception: true
  coverage_note: "IC/stability on 3885d harvest; execution grid on last 252d"

implementation:
