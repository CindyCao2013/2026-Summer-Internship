economic_intuition: |
  20-day returns split by average trade size (ATS = amount / trade_count).
  High-ATS days embed institutional participation → stronger reversal;
  low-ATS days are noise. Spread M = M_high − M_low purifies the signal.

formula:
  object: "Ret20 (additive daily returns)"
  knife: "ATS = amount / trade_count; rank_split 10/10 in 20d window"
  frozen: "M = sum(r | high ATS) − sum(r | low ATS)"
  signal_shift: 1
  window: 20
  direction: negative RankIC (short high M)

